name: Daily digest

on:
  schedule:
    - cron: "30 4 * * *"   # every day at 04:30 UTC (05:30 or 06:30 in Germany)
  workflow_dispatch:        # lets you press "Run workflow" manually

permissions:
  contents: write

concurrency:
  group: daily-digest
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Build today's digest
        run: python -m pipeline.build_digest
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Save results
        run: |
          git config user.name "digest-bot"
          git config user.email "digest-bot@users.noreply.github.com"
          git add docs/data state
          if git diff --staged --quiet; then
            echo "nothing changed"
          else
            git commit -m "Daily digest $(date -u +%F)"
            git pull --rebase
            git push
          fi
