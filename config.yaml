# 5) Learning ---------------------------------------------------------------
learn:
  # The current app derives its curriculum from the field profile above.
  # Keywords guide topic coverage; fixed geographic lesson quotas are not supported.
  lessons_per_day: 2
  foundation_lessons: 20
  developing_lessons: 60

# 6) Defense coach ------------------------------------------------------------
# PRIVACY: everything written here goes to Google's free AI tier and the
# resulting questions appear on your public page. Keep it GENERIC, or set
# enabled: false.
defense:
  enabled: true
  # General research themes only; no unpublished findings or exact designs.
  title: "Urban ecosystem services and environmental planning with application to Kabul"
  chapters:
    - title: "Foundations and international evidence"
      summary: >
        General scholarly preparation in ecosystem service theory, urban
        ecology, social-ecological systems, supply-demand-flow distinctions,
        plural values, environmental justice and planning governance.
        Compare evidence from the Global North and Global South, evaluate
        alternative explanations, and assess when methods and conclusions
        transfer to another city. This is a study theme, not a completed
        thesis chapter or a statement of empirical findings.
    - title: "Spatial patterns and planning"
      summary: >
        Assessment of ecosystem service supply potential, bundles,
        co-occurrence and urban morphology to inform spatial prioritization
        in a data-scarce metropolitan setting. Interpretation must distinguish
        service supply from actual use, and association from mechanism.
    - title: "Land-cover change and settlement expansion"
      summary: >
        Research in development on relationships between settlement expansion
        and modeled ecological functions. Key questions concern comparable
        inputs, baseline conditions, spatial scale, scenario assumptions,
        validation and uncertainty. No completed findings are supplied.
  methods: >
    GIS and remote sensing; integration of spatial datasets; land-cover and
    land-change accuracy assessment; InVEST urban cooling, stormwater runoff
    retention, habitat quality, annual water yield and urban nature access;
    hotspot analysis; clustering and descriptive ecosystem service bundles;
    landscape metrics; spatial statistical modelling; scenario comparison;
    sensitivity and uncertainty assessment. Annual water yield requires
    watershed-scale interpretation. Model estimates are not observations,
    habitat quality is not measured biodiversity, and runoff retention is
    not a direct estimate of flood depth or flood risk. Methods listed here
    are research topics, not a claim that all have been completed.
  # Leave empty until claims are published and suitable for public sharing.
  main_claims: []

# 7) Weekly review ------------------------------------------------------------
weekly_review_day: 6      # 0 = Monday ... 6 = Sunday

