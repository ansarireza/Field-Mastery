  max_queries: 8          # the current app generates at most 8 search queries
  top_n: 6                # papers explained in full each day
  more_n: 10              # extra papers listed by title only
  # Ranking preferences, not a restriction to these journals.
  watch_journals:
    - Landscape and Urban Planning
    - Ecosystem Services
    - City and Environment Interactions
    - Urban Forestry & Urban Greening
    - Ecological Indicators
    - Landscape Ecology
    - Urban Climate
    - Remote Sensing of Environment
    - Environmental Modelling & Software
    - Environment and Urbanization
    - Habitat International
    - Ambio
    - Environmental Management
    - Nature Sustainability
    - Global Environmental Change
    - Ecosystems
    - People and Nature
  # DOIs of papers central to YOUR thesis. New papers that cite them are
  # flagged in the "Watch list" (finds work that confirms or challenges you).
  # Published references from the manuscripts, not the unpublished papers.
  key_references:
    - 10.1111/j.1461-0248.2009.01387.x # Bennett 2009: relationships among ES
    - 10.1126/science.aap8826          # Diaz 2018: nature's contributions
    - 10.1073/pnas.0907284107           # Raudsepp-Hearne 2010: ES bundles
    - 10.1016/j.ecoser.2017.02.021      # Baro 2017: urban-rural ES bundles
    - 10.1016/j.gloenvcha.2017.08.004   # Spake 2017: ES bundle interpretation
    - 10.1007/s13280-023-01841-4        # Adem Esmail 2023: ES mapping in Eritrea
    - 10.1016/j.oneear.2020.02.002      # Satterthwaite 2020: informal settlements
    - 10.1016/j.rse.2014.02.015         # Olofsson 2014: land-change accuracy
    - 10.1111/ecog.02881               # Roberts 2017: spatial cross-validation
    - 10.1016/j.ecoser.2018.09.001      # Bryant 2018: uncertainty assessment

