# ===========================================================================
# FIELD MASTERY - worldwide foundations, Global South context, Kabul application.
# This file is public. Keep API keys, unpublished results and detailed
# unpublished study designs out of it. Store API keys in GitHub Secrets.
# ===========================================================================

# 1) Your field -------------------------------------------------------------
research_question: >
  Urban ecosystem services and environmental planning worldwide, with
  particular attention to the Global South and application to Kabul,
  Afghanistan. How do urban development, land-cover change and settlement
  morphology relate to ecological functions, ecosystem service supply,
  access and human benefits, and how can this evidence inform planning?
  The learning goal is broad expertise in the field: foundational theories,
  landmark ideas, current international research, practical methods and
  critical appraisal. Coverage should balance three complementary strands:
  worldwide theory and transferable methods; Global South urban contexts;
  and Kabul or environmentally comparable cities. Relevant international
  research should be included even when it does not mention Kabul,
  informality or the Global South. For the eight literature searches,
  aim for three worldwide, three Global South and two Kabul or comparable
  context queries, allowing overlap. These are coverage preferences.
  The core services are urban cooling and heat mitigation, stormwater runoff
  retention, habitat quality, annual water yield and access to urban nature.
  The focus includes formal development, informal flatland and hillside
  settlements, peri-urban agriculture and green-blue infrastructure in
  semi-arid, mountainous, data-scarce and conflict-affected settings.
  Relevant approaches include InVEST, remote sensing, ecosystem service
  bundles, landscape configuration, land-change validation, spatial modelling,
  scenario comparison and uncertainty assessment for environmental planning.
  Foundational learning also covers urban ecology, social-ecological systems,
  the ecosystem service cascade, nature's contributions to people, supply,
  demand and service flows, plural values, environmental justice, governance,
  research design, spatial statistics and transferability between cities.
  Modeled supply potential is distinguished from actual service delivery;
  spatial associations and scenario contributions are distinguished from
  causal effects of settlement status.

keywords:
  # Worldwide foundations: relevant work can come from any region.
  - ecosystem service theory and cascade
  - urban ecology and social-ecological systems
  - nature's contributions to people
  - ecosystem service capacity supply demand flows and benefits
  - plural values of nature
  - environmental planning and governance
  - research design and causal inference
  # Core topic and urban development
  - urban ecosystem services
  - urban expansion
  - land-use and land-cover change
  - informal settlements
  - formal and informal urban development
  - hillside settlements
  - urban morphology
  - peri-urban agriculture
  # The five services and their planning applications
  - urban cooling
  - heat mitigation
  - stormwater runoff retention
  - habitat quality
  - annual water yield
  - urban nature access
  - green-blue infrastructure
  - nature-based solutions
  - ecosystem service bundles
  - landscape multifunctionality
  - ecosystem service supply and demand
  - environmental justice
  # Methods needed across the two research strands
  - InVEST ecosystem service modelling
  - remote sensing land-change accuracy assessment
  - landscape configuration and fragmentation
  - spatial autocorrelation and spatial cross-validation
  - ecosystem service scenario analysis
  - model validation and sensitivity analysis
  - comparative urban research and transferability
  # Broader field
  - environmental spatial planning
  - urban ecology Global South
  - data-scarce cities

regions:
  # Context preferences, not geographic exclusions or enforced quotas.
  # Include worldwide research alongside the regional and case-study focus.
  - Kabul
  - Afghanistan
  - South Asia
  - Central Asia
  - Global South
  - arid and semi-arid cities
  - mountainous cities
  - conflict-affected cities
  - Sub-Saharan Africa
  - Latin America
  - Southeast Asia
  - East Asia
  - Europe
  - North America
  - Oceania

# How much background to assume in the plain-language explanations:
#   beginner | intermediate | advanced
level: intermediate

# 2) Papers -----------------------------------------------------------------
papers:
